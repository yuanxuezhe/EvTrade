[project]
name = "evtrade"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aio-pika>=7.0.0,<8.0.0",
    "backtrader>=1.9.78.123",
    "bcrypt>=4.0.0,<5.0.0",
    "cryptography>=42.0.0",
    "fastapi>=0.83.0,<1.0.0",
    "msgpacket",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "passlib>=1.7.0,<2.0.0",
    "pika>=1.4.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pymysql>=1.1.0,<2.0.0",
    "pypinyin>=0.50.0,<1.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "python-dotenv>=1.2.2",
    "python-jose>=3.3.0,<4.0.0",
    "python-multipart>=0.0.5,<1.0.0",
    "requests>=2.34.2",
    "sqlalchemy>=1.4.0,<2.0.0",
    "uvicorn>=0.52,<1.0",
    "websockets>=13.0,<17.0",
]

[tool.uv.sources]
msgpacket = { path = "vendor/msgpacket-1.1.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# 不强制 E501 (line too long): 项目遗留长行 (URL / SQL / 注释) 由后续清理 change 处理
extend-ignore = ["E501"]
# 排除虚拟环境/构建产物/前端打包产物
extend-exclude = [
    ".venv",
    "node_modules",
    "client/dist",
    "*.egg-info",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
# 单独模块豁免: 第三方 vendor 目录 / iquant 量化库保留宽松规则
per-file-ignores = { "iquant/*" = ["F401"] }
