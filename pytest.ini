[pytest]
asyncio_mode = auto
# `server/tests/` holds the working unit/integration tests (auth / push / services /
# test_place_async / test_v78_skip_rebroadcast / test_rpc_handlers / test_script_*).
# `tests/` at root keeps integration scripts (strategy_exec / hq / client / stress_* /
# test_quote_pattern_subscribe). Legacy `tests/server/` was deleted (it referenced
# `server.models.orm` / `server.models.user` modules removed in v13).
testpaths = server/tests tests
addopts = --ignore=tests/server/rpc