        type: String(32)
        nullable: false
        default: 
      last_value:
        type: Integer
        nullable: false
        default: 0
      updated_at:
        type: DateTime
        nullable: false
        default: 
  orders:
    pk: ['trd_date', 'order_no']
    columns:
      trd_date:
        type: String(8)
        nullable: false
        default: 
      order_no:
        type: String(8)
        nullable: false
        default: 
      order_id:
        type: String(64)
        nullable: true
      user_def:
        type: String(255)
        nullable: false
        default: 
      stock_code:
        type: String(16)
        nullable: false
        default: 
      order_type:
        type: String(2)
        nullable: false
        default: 
      price_type:
        type: Integer
        nullable: false
        default: 0
      price:
        type: Float
        nullable: false
        default: 0.0
      volume:
        type: Integer
        nullable: false
        default: 0
      traded_volume:
