# EvTrade database schema
# Edit this file, then: python scripts/sync_schema.py apply

tables:
  _applied_migrations:
    pk: ['name']
    columns:
      name:
        type: String(255)
        nullable: false
        default: 
      applied_at:
        type: DateTime
        nullable: false
        server_default: CURRENT_TIMESTAMP
