      raw_id:
        type: String(8)
        nullable: true
      task_id:
        type: Integer
        nullable: true
      strategy_type:
        type: Integer
        nullable: false
        default: 0
      created_at:
        type: DateTime
        nullable: false
        default: 
      updated_at:
        type: DateTime
        nullable: false
        default: 
      pushed_at:
        type: DateTime
        nullable: true
