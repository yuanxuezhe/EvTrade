        nullable: false
        default: 0.0
      low:
        type: Float
        nullable: false
        default: 0.0
      avg_price:
        type: Float
        nullable: false
        default: 0.0
      volume:
        type: Integer
        nullable: false
        default: 0
  quote_sync_config:
    pk: ['stock_code']
    columns:
      stock_code:
        type: String(16)
        nullable: false
        default:
      start_date:
        type: String(8)
        nullable: false
        default:
      end_date:
        type: String(8)
        nullable: false
        default:
      last_loaded_date:
        type: String(8)
        nullable: false
