[project]
name = "strategy-exec"
version = "0.1.0"
description = "EvTrade strategy execution service (Backtrader + RabbitMQ) — v120+ 复用 EvTrade 根 .venv"
requires-python = ">=3.10"
authors = [{ name = "EvTrade" }]
# v120+ 不再独立 venv, 复用 EvTrade 根 .venv
# 依赖在 EvTrade 根 pyproject.toml + 手动 uv pip install 维护
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
strategy-exec = "strategy_exec.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["strategy_exec*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]